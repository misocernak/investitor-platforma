name: Deploy na investitor.temelj.info
on:
  push:
    branches: [ main ]
  workflow_dispatch:        # dugme "Run workflow" na GitHub-u za ručno pokretanje

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Pripremi PHP 8.2 i Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Instaliraj Laravel biblioteke (vendor/)
        run: |
          mkdir -p bootstrap/cache
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      # CSS (Tailwind) se pravi ovde, jednom po deploy-u → public/css/app.css
      - name: Pripremi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Napravi CSS
        run: |
          npm install --no-audit --no-fund
          npm run build:css
          ls -la public/css/app.css

      # FTP akcija preskače fajlove koji počinju sa ".git" (i .gitkeep), pa bi prazni
      # folderi koje Laravel mora da ima ostali nenapravljeni na serveru.
      - name: Oznaci prazne foldere
        run: find storage bootstrap/cache -type d -exec touch {}/.keep \;

      # Namecheap povremeno ne otvori FTP vezu na vreme kad se šalje mnogo fajlova
      # (prvi deploy nosi i ceo vendor/). Zato: duži timeout + do 2 nova pokušaja.
      # Pokušaj koji uspe upisuje stanje na server, pa sledeći deploy šalje samo izmene.
      - name: Uploaduj na server preko FTP-a (pokušaj 1)
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          timeout: 120000
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            .env

      - name: Uploaduj na server preko FTP-a (pokušaj 2)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          timeout: 120000
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            .env

      - name: Uploaduj na server preko FTP-a (pokušaj 3)
        id: ftp3
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        continue-on-error: false
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          timeout: 120000
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            .env
